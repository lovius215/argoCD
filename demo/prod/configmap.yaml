apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-config
  namespace: prod
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8092"
  SPRING_DATA_REDIS_HOST: "redis-prod.prod.svc"
  SPRING_DATA_REDIS_PORT: "6379"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin-prod.prod.svc:9411/api/v2/spans"
  MANAGEMENT_ZIPKIN_ENDPOINT: "http://zipkin-prod.prod.svc:9411/api/v2/spans"
  SPRING_ZIPKIN_ENDPOINT: "http://zipkin-prod.prod.svc:9411/api/v2/spans"
  SPRING_ZIPKIN_BASE_URL: "http://zipkin-prod.prod.svc:9411"
  LOGGING_LEVEL_COM_EXAMPLE: "INFO"
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Taipei"
